<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lotería del Abuelo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="app-style">
:root{
  --bg:#eef1ea;
  --surface:#ffffff;
  --surface-2:#e2e7d9;
  --ink:#1e2b25;
  --ink-soft:#5b6a60;
  --border:#d3d9c6;
  --accent:#a06a24;
  --accent-ink:#7a4f18;
  --accent-soft:#f0e2c8;
  --good:#3c7a4d;
  --good-soft:#dcefe0;
  --warn:#a4402c;
  --warn-soft:#f7ded7;
  --shadow: 0 1px 2px rgba(30,43,37,.06), 0 6px 20px -8px rgba(30,43,37,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151b17; --surface:#1d2620; --surface-2:#242f27;
    --ink:#eef1ea; --ink-soft:#a3ada2; --border:#374238;
    --accent:#d9a75a; --accent-ink:#f2cd94; --accent-soft:#3a3120;
    --good:#7fc98f; --good-soft:#1e3226;
    --warn:#e08b78; --warn-soft:#3a231e;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#151b17; --surface:#1d2620; --surface-2:#242f27;
  --ink:#eef1ea; --ink-soft:#a3ada2; --border:#374238;
  --accent:#d9a75a; --accent-ink:#f2cd94; --accent-soft:#3a3120;
  --good:#7fc98f; --good-soft:#1e3226;
  --warn:#e08b78; --warn-soft:#3a231e;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px;margin:0 auto;padding:2.5rem 1.25rem 5rem;}
h1,h2,h3{font-family:'Source Serif 4', Georgia, serif; text-wrap:balance; margin:0;}
.eyebrow{
  font-family:'IBM Plex Sans',sans-serif; text-transform:uppercase;
  letter-spacing:.11em; font-size:.72rem; font-weight:600;
  color:var(--accent-ink); margin:0 0 .5rem;
}
header.top{margin-bottom:2rem;}
header.top h1{font-size:2.05rem;font-weight:700;}
header.top p{color:var(--ink-soft);max-width:62ch;margin:.6rem 0 0;font-size:.98rem;}
.mono{font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums;}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem;}
.stats > .stat-card{min-width:0;}
@media (max-width:560px){.stats{grid-template-columns:1fr;}}
.stat-card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; padding:1.25rem 1.35rem; box-shadow:var(--shadow);
}
.stat-card .who{font-size:.82rem;color:var(--ink-soft);font-weight:500;margin-bottom:.35rem;}
.stat-card .amount{font-size:2rem;font-weight:600;letter-spacing:-.01em;}
.stat-card .sub{font-size:.78rem;color:var(--ink-soft);margin-top:.45rem;}
.pill{
  display:inline-flex;align-items:center;gap:.35rem;
  font-size:.74rem;font-weight:600;letter-spacing:.02em;
  padding:.22rem .6rem;border-radius:99px;margin-top:.5rem;
}
.pill.warn{background:var(--warn-soft);color:var(--warn);}
.pill.good{background:var(--good-soft);color:var(--good);}

.panel{
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; padding:1.35rem 1.4rem 1.5rem;
  box-shadow:var(--shadow); margin-bottom:1.5rem;
}
.panel h2{font-size:1.15rem;font-weight:700;}
.panel .hint{color:var(--ink-soft);font-size:.85rem;margin:.2rem 0 1rem;max-width:62ch;}

/* ---- pendientes ---- */
.panel.pend{border-color:var(--accent);}
.pend-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;}
.badge{
  background:var(--accent);color:#fff;font-size:.72rem;font-weight:700;
  padding:.12rem .5rem;border-radius:99px;
}
.pend-list{display:flex;flex-direction:column;gap:.45rem;}
.pend-row{
  display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
  border:1px solid var(--border);border-radius:10px;
  padding:.55rem .75rem;background:var(--surface-2);
}
.pend-row.due{border-color:var(--accent);background:var(--accent-soft);}
.pend-date{font-weight:600;font-size:.9rem;min-width:8.5rem;}
.pend-precio{
  font-family:'IBM Plex Mono',monospace;font-size:.85rem;
  color:var(--ink-soft);flex:1;min-width:13rem;
  display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
}
.pend-precio input{
  font:inherit;font-family:'IBM Plex Mono',monospace;font-size:.85rem;
  width:5rem;text-align:right;padding:.25rem .45rem;
  border:1px solid var(--border);border-radius:7px;
  background:var(--surface);color:var(--ink);
}
.pend-precio input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.pend-split{white-space:nowrap;}
.pend-tag{
  font-family:'IBM Plex Sans',sans-serif;font-size:.68rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;
  background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);
  padding:.1rem .4rem;border-radius:99px;
}
.pend-actions{display:flex;gap:.4rem;margin-left:auto;}
.btn-sm{
  font:inherit;font-size:.8rem;font-weight:600;
  background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:.35rem .8rem;cursor:pointer;
}
.btn-sm:hover{filter:brightness(1.07);}
.btn-sm.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--border);}
.btn-sm.ghost:hover{filter:none;border-color:var(--accent);color:var(--ink);}
.pend-more{margin-top:.7rem;font-size:.82rem;color:var(--ink-soft);}
.linkish{background:none;border:none;color:var(--accent-ink);font:inherit;font-size:.82rem;cursor:pointer;text-decoration:underline;padding:0;}

/* ---- tabs ---- */
.tabs{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:1.1rem;}
.tab{
  font:inherit;font-size:.85rem;font-weight:600;
  border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
  padding:.45rem .95rem;border-radius:99px;cursor:pointer;
}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}

form.entry-form{display:flex;flex-direction:column;gap:.7rem;max-width:520px;}
.field{display:flex;flex-direction:column;gap:.3rem;min-width:0;}
.field label{font-size:.78rem;font-weight:600;color:var(--ink-soft);}
.field input, .field select{
  font:inherit;font-family:'IBM Plex Sans',sans-serif;
  padding:.5rem .65rem;border:1px solid var(--border);border-radius:8px;
  background:var(--surface);color:var(--ink);width:100%;min-width:0;
}
.field input:focus, .field select:focus{outline:2px solid var(--accent);outline-offset:1px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
.row2 > .field{min-width:0;}
@media (max-width:520px){.row2{grid-template-columns:1fr;}}
.quickrow{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:-.15rem;}
.chip{
  font-family:'IBM Plex Mono',monospace;font-size:.78rem;
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink);
  padding:.28rem .6rem;border-radius:99px;cursor:pointer;
}
.chip:hover{border-color:var(--accent);}
.btn{
  margin-top:.3rem;font:inherit;font-weight:600;font-size:.88rem;
  background:var(--accent);color:#fff;border:none;border-radius:9px;
  padding:.6rem 1rem;cursor:pointer;
}
.btn:hover{filter:brightness(1.06);}
.btn.secondary{background:transparent;color:var(--ink-soft);border:1px solid var(--border);}
.editnote{font-size:.78rem;color:var(--accent-ink);background:var(--accent-soft);padding:.4rem .6rem;border-radius:8px;}

/* ---- premio: numeros ---- */
.nums{display:flex;flex-direction:column;gap:.5rem;}
.num-row{
  display:grid;grid-template-columns:1fr 8.5rem;gap:.6rem;align-items:center;
  border:1px solid var(--border);border-radius:10px;padding:.5rem .7rem;
}
.num-row.on{border-color:var(--accent);background:var(--accent-soft);}
.num-id{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.95rem;}
.num-meta{font-size:.74rem;color:var(--ink-soft);}
.num-row input{
  font:inherit;font-family:'IBM Plex Mono',monospace;
  padding:.4rem .55rem;border:1px solid var(--border);border-radius:8px;
  background:var(--surface);color:var(--ink);width:100%;min-width:0;text-align:right;
}
.num-row input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.preview{
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:.65rem .8rem;font-size:.86rem;
}
.preview .pv-line{display:flex;justify-content:space-between;gap:1rem;}
.preview .pv-line + .pv-line{margin-top:.25rem;}
.preview .pv-val{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:600;}
.preview .pv-none{color:var(--ink-soft);font-style:italic;}

/* ---- barra de dónde se guarda ---- */
#modo-aviso{
  position:sticky;top:0;z-index:50;
  padding:.6rem 1.1rem;font-size:.85rem;line-height:1.4;
  display:flex;gap:.6rem;align-items:flex-start;flex-wrap:wrap;
}
#modo-aviso strong{font-weight:700;}
#modo-aviso .ca-txt{flex:1;min-width:14rem;}
#modo-aviso.malo{background:var(--warn);color:#fff;}
#modo-aviso.local{background:var(--accent-soft);color:var(--accent-ink);border-bottom:1px solid var(--accent);}

/* ---- deshacer ---- */
.undo-bar{
  display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
  background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:12px;padding:.6rem .9rem;margin-bottom:1.5rem;
  font-size:.86rem;color:var(--accent-ink);
}
.undo-bar .undo-txt{flex:1;min-width:12rem;}

/* ---- cuenta con la lotería ---- */
.panel.lot{border-color:var(--good);}
.lot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-bottom:1.1rem;}
.lot-grid > div{min-width:0;}
@media (max-width:620px){.lot-grid{grid-template-columns:1fr;}}
.lot-tile{border:1px solid var(--border);border-radius:11px;padding:.85rem 1rem;background:var(--surface-2);}
.lot-tile.deuda{background:var(--warn-soft);border-color:var(--warn);}
.lot-tile.aldia{background:var(--good-soft);border-color:var(--good);}
.lot-tile .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600;}
.lot-tile .val{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:600;margin-top:.2rem;}
.lot-tile .foot{font-size:.75rem;color:var(--ink-soft);margin-top:.15rem;}
.meses{overflow-x:auto;}
.meses table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:560px;}
.meses th{text-align:right;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-soft);font-weight:600;padding:.45rem .6rem;background:var(--surface-2);}
.meses th:first-child{text-align:left;}
.meses td{padding:.45rem .6rem;border-top:1px solid var(--border);text-align:right;
  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;white-space:nowrap;}
.meses td:first-child{text-align:left;font-family:'IBM Plex Sans',sans-serif;font-weight:600;}
.meses td:last-child{text-align:left;}
.meses tr.debe{background:var(--warn-soft);}
.meses tr.debe td{color:var(--warn);}
.meses tr.pagado td:first-child{font-weight:500;color:var(--ink-soft);}
.mes-btn{
  font:inherit;font-size:.75rem;font-weight:600;border-radius:99px;cursor:pointer;
  padding:.2rem .65rem;border:1px solid var(--border);
}
.mes-btn.debe{background:var(--warn);color:#fff;border-color:var(--warn);}
.mes-btn.ok{background:transparent;color:var(--good);border-color:var(--good);}
.mes-bulk{
  background:none;border:none;color:var(--accent-ink);font:inherit;font-size:.72rem;
  cursor:pointer;text-decoration:underline;padding:0;margin-left:.5rem;
}
.aprox{color:var(--warn);cursor:help;font-weight:700;}

/* ---- jugado vs recuperado ---- */
.bal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-bottom:1.1rem;}
.bal-grid > div{min-width:0;}
@media (max-width:620px){.bal-grid{grid-template-columns:1fr;}}
.bal-tile{
  border:1px solid var(--border);border-radius:11px;padding:.85rem 1rem;background:var(--surface-2);
}
.bal-tile .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600;}
.bal-tile .val{
  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;
  font-size:1.35rem;font-weight:600;margin-top:.2rem;
}
.bal-tile .foot{font-size:.75rem;color:var(--ink-soft);margin-top:.15rem;}
.bal-tile.sal{background:var(--accent-soft);border-color:var(--accent);}
.desglose{overflow-x:auto;}
.desglose table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:440px;}
.desglose th{
  text-align:right;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-soft);font-weight:600;padding:.4rem .6rem;
}
.desglose th:first-child{text-align:left;}
.desglose td{padding:.42rem .6rem;border-top:1px solid var(--border);text-align:right;
  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
.desglose td:first-child{text-align:left;font-family:'IBM Plex Sans',sans-serif;}
.desglose tr.dudosa td{color:var(--warn);}
.desglose .cnt{font-size:.75rem;color:var(--ink-soft);}
.aviso{
  font-size:.8rem;color:var(--warn);background:var(--warn-soft);
  border-radius:9px;padding:.5rem .7rem;margin-top:.9rem;
}

/* ---- descargas ---- */
#export-box{
  margin-top:.9rem;border:1px solid var(--accent);border-radius:11px;
  padding:.8rem .9rem;background:var(--accent-soft);
}
#export-box p{margin:0 0 .55rem;font-size:.84rem;color:var(--accent-ink);}
#export-box textarea{
  width:100%;min-height:8rem;resize:vertical;
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;line-height:1.35;
  padding:.5rem .6rem;border:1px solid var(--border);border-radius:8px;
  background:var(--surface);color:var(--ink);
}
#export-box .exp-acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.55rem;}
.dl-row{display:flex;gap:.5rem;flex-wrap:wrap;}
.dl-status{font-size:.82rem;color:var(--ink-soft);margin-top:.7rem;min-height:1.2em;}
.dl-status.ok{color:var(--good);}
.dl-status.err{color:var(--warn);}

/* ---- resumen anual ---- */
.years{overflow-x:auto;}
.years table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:420px;}
.years th{
  text-align:right;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-soft);font-weight:600;padding:.4rem .6rem;
}
.years th:first-child{text-align:left;}
.years td{padding:.42rem .6rem;border-top:1px solid var(--border);text-align:right;
  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
.years td:first-child{text-align:left;font-family:'IBM Plex Sans',sans-serif;font-weight:600;}

/* ---- historial ---- */
.filters{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-bottom:.9rem;}
.filters .grp{display:flex;gap:.35rem;flex-wrap:wrap;}
.filter-chip{
  font-size:.78rem;font-weight:500;
  border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
  padding:.28rem .65rem;border-radius:99px;cursor:pointer;
}
.filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;}
table.hist{width:100%;border-collapse:collapse;font-size:.88rem;min-width:600px;}
table.hist thead th{
  text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-soft);font-weight:600;padding:.6rem .7rem;background:var(--surface-2);
  position:sticky;top:0;
}
table.hist tbody td{padding:.55rem .7rem;border-top:1px solid var(--border);vertical-align:top;}
table.hist tbody tr:hover{background:var(--surface-2);}
td.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.neg{color:var(--good);}
.pos{color:var(--ink);}
.flag{color:var(--warn);font-weight:700;margin-right:.3rem;}
.ded{
  font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  color:var(--ink-soft);border:1px dashed var(--border);border-radius:99px;
  padding:.05rem .38rem;margin-left:.35rem;white-space:nowrap;cursor:help;
}
.rowactions{display:flex;gap:.4rem;white-space:nowrap;}
.iconbtn{
  border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:.8rem;
  padding:.15rem .3rem;border-radius:6px;
}
.iconbtn:hover{background:var(--surface-2);color:var(--ink);}
.empty{color:var(--ink-soft);font-style:italic;padding:1rem;text-align:center;}
.status{font-size:.82rem;color:var(--ink-soft);min-height:1.2em;margin-top:.6rem;}
.status.ok{color:var(--good);}
footer.note{color:var(--ink-soft);font-size:.8rem;margin-top:2rem;max-width:66ch;}
</style>
</head>

<script>
const LOGIC_SRC = document.currentScript.textContent;

const NUMEROS = [
  { id:'12', numero:'19012', reparto:.5,  nota:'mitad Papá / mitad Abuelo y Malle' },
  { id:'34', numero:'32534', reparto:.5,  nota:'mitad Papá / mitad Abuelo y Malle' },
  { id:'97', numero:'21997', reparto:0,   nota:'entero de Abuelo y Malle' }
];

const raw = JSON.parse(document.getElementById('app-data').textContent);
let state = Array.isArray(raw)
  ? { movements: raw, pendientes: [], saltadas: [], deshacer: null, loteria: { pagados: [] } }
  : { movements: raw.movements || [], pendientes: raw.pendientes || [],
      saltadas: raw.saltadas || [], deshacer: raw.deshacer || null,
      loteria: raw.loteria || { pagados: [] } };

/* precios habituales observados en el histórico */
const PRECIO_NORMAL = 6;
const PRECIO_ESPECIAL = 20;   // Niño (6 ene), Especial de Verano (1er sábado de julio), Navidad (22 dic)
const MESES_VISTA = 6;        // hasta dónde se proponen sorteos nuevos

let ui = { year:'todos', tipo:'todos', editId:null, editTipo:null, tab:'sorteo', verTodasPend:false, flash:'' };

function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
function fmtEUR(n){ return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n); }
function hoy(){ return new Date().toISOString().slice(0,10); }
function fmtFecha(iso){
  if(!iso) return '—';
  return new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'short',year:'numeric'})
    .format(new Date(iso + 'T00:00:00'));
}
function fmtFechaCorta(iso){
  if(!iso) return '—';
  return new Intl.DateTimeFormat('es-ES',{weekday:'short',day:'2-digit',month:'short'})
    .format(new Date(iso + 'T00:00:00'));
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nextId(){ return state.movements.reduce((m,x) => Math.max(m, x.id), 0) + 1; }

/* Guarda cómo estaba todo justo antes de tocar nada, para poder volver atrás.
   Se publica con la página, así que el "Deshacer" sigue ahí aunque recargues
   o entres desde otro sitio. */
function guardarDeshacer(desc){
  state.deshacer = {
    desc: desc,
    movements: state.movements.map(m => ({ ...m })),
    pendientes: state.pendientes.map(p => ({ ...p })),
    saltadas: state.saltadas.slice(),
    loteria: { pagados: state.loteria.pagados.slice() }
  };
}

/* Evita apuntar dos veces el mismo sorteo: ya pasó una vez con el de Navidad. */
function yaHaySorteo(fecha, excluirId){
  return state.movements.some(m => m.tipo === 'jugada' && m.fecha === fecha && m.id !== excluirId);
}
function confirmarDuplicado(fecha, excluirId){
  if(!yaHaySorteo(fecha, excluirId)) return true;
  return confirm('Ya hay un sorteo apuntado el ' + fmtFecha(fecha) + '.\n\n'
               + 'Si lo apuntas otra vez se cobrará dos veces. ¿Seguro que quieres añadirlo?');
}
function totales(list){
  let papa = 0, abuelo = 0;
  for(const m of list){ papa += m.papa; abuelo += m.abuelo; }
  return { papa: round2(papa), abuelo: round2(abuelo) };
}
function years(){
  return Array.from(new Set(state.movements.filter(m=>m.fecha).map(m=>m.fecha.slice(0,4)))).sort().reverse();
}
function statusPill(a){
  if(a >  .01) return { label:'Debe ' + fmtEUR(a), cls:'warn' };
  if(a < -.01) return { label:'A favor ' + fmtEUR(Math.abs(a)), cls:'good' };
  return { label:'Al día', cls:'good' };
}
function ultimaJugada(){
  const j = state.movements.filter(m => m.tipo === 'jugada' && m.fecha).map(m => m.fecha).sort();
  return j.length ? j[j.length-1] : hoy();
}
function iso(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

/* Propone los sorteos que vienen: todos los sábados, más los tres especiales
   del año (6 de enero, primer sábado de julio y 22 de diciembre). Los precios
   de los especiales son los de siempre; el resto sale a 6 € porque es el
   habitual, y se puede cambiar en la propia fila antes de registrar. */
function generarPendientes(){
  const jugadas = new Set(state.movements.filter(m => m.tipo === 'jugada' && m.fecha).map(m => m.fecha));
  const guardadas = new Set(state.pendientes.map(p => p.fecha));
  const saltadas = new Set(state.saltadas);

  const ultima = Array.from(jugadas).sort().pop();
  const desde = new Date((ultima && ultima > hoy() ? ultima : hoy()) + 'T00:00:00');
  desde.setDate(desde.getDate() + 1);
  if(ultima && ultima < hoy()){                       // si va con retraso, arranca en el día siguiente al último apuntado
    const u = new Date(ultima + 'T00:00:00'); u.setDate(u.getDate() + 1);
    desde.setTime(u.getTime());
  }
  const hasta = new Date(hoy() + 'T00:00:00');
  hasta.setMonth(hasta.getMonth() + MESES_VISTA);

  const fuera = f => jugadas.has(f) || guardadas.has(f) || saltadas.has(f);
  const out = [];

  for(let d = new Date(desde); d <= hasta; d.setDate(d.getDate() + 1)){
    const f = iso(d), mes = d.getMonth() + 1, dia = d.getDate();
    let precio = null;
    if(mes === 1 && dia === 6) precio = PRECIO_ESPECIAL;              // El Niño
    else if(mes === 12 && dia === 22) precio = PRECIO_ESPECIAL;       // Navidad
    else if(d.getDay() === 6){                                       // sábado
      if(mes === 12 && dia > 15) continue;                           // la semana previa a Navidad no hay sorteo normal
      if(mes === 1 && dia < 7) continue;                             // ni los primeros días de enero
      precio = (mes === 7 && dia <= 7) ? PRECIO_ESPECIAL : PRECIO_NORMAL;
    }
    if(precio === null || fuera(f)) continue;
    out.push({ fecha: f, precio, auto: true });
  }
  return out;
}

function pendientesOrdenadas(){
  const saltadas = new Set(state.saltadas);
  const jugadas = new Set(state.movements.filter(m => m.tipo === 'jugada' && m.fecha).map(m => m.fecha));
  const guardadas = state.pendientes
    .filter(p => !saltadas.has(p.fecha) && !jugadas.has(p.fecha))
    .map(p => ({ fecha: p.fecha, precio: p.precio, auto: false }));
  return guardadas.concat(generarPendientes()).sort((a,b) => a.fecha < b.fecha ? -1 : 1);
}
function proximaPendiente(){
  const p = pendientesOrdenadas();
  return p.length ? p[0].fecha : hoy();
}

/* reparto de un premio: devuelve {papa, abuelo} en positivo */
function repartoPremio(importes){
  let papa = 0, abuelo = 0;
  for(const n of NUMEROS){
    const amt = importes[n.id];
    if(!amt) continue;
    papa   += amt * n.reparto;
    abuelo += amt * (1 - n.reparto);
  }
  return { papa: round2(papa), abuelo: round2(abuelo) };
}
/* nota legible: agrupa números que comparten importe -> "15 € en el 12 y el 97" */
function notaPremio(importes){
  const grupos = new Map();
  for(const n of NUMEROS){
    const amt = importes[n.id];
    if(!amt) continue;
    if(!grupos.has(amt)) grupos.set(amt, []);
    grupos.get(amt).push('el ' + n.id);
  }
  const partes = [];
  for(const [amt, ids] of grupos){
    const lista = ids.length > 1 ? ids.slice(0,-1).join(', ') + ' y ' + ids[ids.length-1] : ids[0];
    partes.push(fmtEUR(amt) + ' en ' + lista);
  }
  return partes.join(' · ');
}

/* ---------- vistas ---------- */

function renderStats(){
  const t = totales(state.movements);
  const anyo = new Date().getFullYear().toString();
  const tAnyo = totales(state.movements.filter(m => m.fecha && m.fecha.slice(0,4) === anyo));
  const p = statusPill(t.papa), a = statusPill(t.abuelo);
  return `
  <div class="stats">
    <div class="stat-card">
      <div class="who">Papá</div>
      <div class="amount mono">${fmtEUR(Math.abs(t.papa))}</div>
      <span class="pill ${p.cls}">${p.label}</span>
      <div class="sub">En ${anyo}: ${fmtEUR(tAnyo.papa)}</div>
    </div>
    <div class="stat-card">
      <div class="who">Abuelo y Malle</div>
      <div class="amount mono">${fmtEUR(Math.abs(t.abuelo))}</div>
      <span class="pill ${a.cls}">${a.label}</span>
      <div class="sub">En ${anyo}: ${fmtEUR(tAnyo.abuelo)}</div>
    </div>
  </div>`;
}

function renderDeshacer(){
  if(!state.deshacer) return '';
  return `<div class="undo-bar">
    <span class="undo-txt">Última acción: ${escapeHtml(state.deshacer.desc)}</span>
    <button class="btn-sm ghost" data-undo="1">Deshacer</button>
  </div>`;
}

/* ---------- jugado vs recuperado ---------- */

/* Los apuntes viejos (2021-2024) muchas veces se guardaron solo como "Ajuste",
   sin decir si fue premio o pago. Eso no se puede adivinar, así que se cuenta
   aparte en vez de repartirlo a ojo. */
function clasificarAjuste(nota){
  const n = (nota || '').toLowerCase();
  const premio = /premio|en todos|€\s*(?:en\s+)?(?:l\s+|el\s+)?\d|\ben\s+el\s+\d/.test(n);
  const pago   = /abona|abono|pagado/.test(n);
  if(premio && pago) return 'mixto';
  if(premio) return 'premio';
  if(pago) return 'pago';
  return 'sin';
}

/* Precio del sorteo al que va pegado cada apunte: es la referencia contra la
   que se mide si una cifra puede ser un premio. */
function preciosAsociados(){
  const ord = state.movements.slice().sort((a,b) => {
    const fa = a.fecha || '', fb = b.fecha || '';
    if(fa !== fb) return fa < fb ? -1 : 1;
    return a.id - b.id;
  });
  const mapa = {};
  let ultimo = null;
  for(const x of ord){
    if(x.tipo === 'jugada') ultimo = x.papa;
    mapa[x.id] = ultimo;
  }
  return mapa;
}

/* Deduce si un apunte sin concepto fue premio o pago, solo con los importes.
   La clave: un premio deja una firma que un abono no puede imitar. Lo que toca
   en el 19012 y el 32534 se parte a medias y lo del 21997 va entero para Abuelo
   y Malle, así que de las dos cifras se puede despejar cuánto tocó en cada sitio
   — y eso tiene que ser un múltiplo entero de lo jugado esa semana.
   Comprobado contra los apuntes que sí llevan concepto: acierta el 95%. */
function deducirAjuste(x, precio){
  const p = -x.papa, a = -x.abuelo;
  if(x.papa > 0 || x.abuelo > 0)
    return { tipo:'otro', conf:'alta', motivo:'suma deuda en vez de restarla, así que no es ni premio ni pago' };
  if(!precio) return { tipo:'?', conf:'baja', motivo:'no consta el precio de ese sorteo' };
  if(a < p - 1e-9)
    return { tipo:'pago', conf:'media', motivo:'Abuelo y Malle reciben menos que Papá, y el reparto de premios no lo permite' };
  const kx = (2*p) / precio, ky = (a - p) / precio;
  const entero = k => Math.abs(k - Math.round(k)) < 1e-6;
  if(!(entero(kx) && entero(ky)))
    return { tipo:'pago', conf:'alta', motivo:'las cifras no son múltiplos de lo jugado esa semana' };
  if(Math.max(kx, ky) > 6)
    return { tipo:'pago', conf:'media', motivo:'como premio sería ' + Math.round(Math.max(kx,ky)) + '× lo jugado, más de lo visto nunca' };
  if(p > 0)
    return { tipo:'premio', conf:'alta', motivo:'Papá recibe exactamente la mitad: firma del reparto de premios' };
  return { tipo:'premio', conf:'media', motivo:'encaja como premio del 21997, aunque un abono podría dar la misma cifra' };
}

/* Categoría final: manda el concepto escrito; si no lo hay, se deduce. */
function categoriaAjuste(x, precio){
  if(x.nota && x.nota.indexOf('Ajuste de cierre') === 0)
    return { cat: 'otro', deducido: false };
  if(x.papa > 0 || x.abuelo > 0)
    return { cat: 'otro', deducido: false };
  const c = clasificarAjuste(x.nota);
  if(c !== 'sin') return { cat: c, deducido: false };
  const d = deducirAjuste(x, precio);
  if(d.tipo === '?') return { cat: 'sin', deducido: false, det: d };
  return { cat: d.tipo, deducido: true, det: d };
}

function balance(){
  const precios = preciosAsociados();
  const jug = state.movements.filter(m => m.tipo === 'jugada');
  const aj  = state.movements.filter(m => m.tipo === 'ajuste');
  const suma = list => ({
    papa: round2(list.reduce((s,x) => s + x.papa, 0)),
    abuelo: round2(list.reduce((s,x) => s + x.abuelo, 0)),
    n: list.length
  });

  const grupos = { premio:[], pago:[], mixto:[], otro:[], sin:[] };
  let nDedPremio = 0, nDedPago = 0;
  for(const x of aj){
    const r = categoriaAjuste(x, precios[x.id]);
    grupos[r.cat].push(x);
    if(r.deducido && r.cat === 'premio') nDedPremio++;
    if(r.deducido && r.cat === 'pago') nDedPago++;
  }
  const cats = {};
  for(const c of ['premio','pago','mixto','otro','sin']) cats[c] = suma(grupos[c]);

  const anios = new Set(state.movements.filter(m => m.fecha).map(m => m.fecha.slice(0,4)));
  return { jugado: suma(jug), ajustes: suma(aj), cats, anios: anios.size,
           nDedPremio, nDedPago, nSinConcepto: aj.filter(x => clasificarAjuste(x.nota) === 'sin').length };
}

/* ---------- cuenta con la administradora de lotería ----------
   Los décimos quedan en custodia allí; ella cobra los tres números y descuenta
   los premios, y se le paga por meses. Aquí solo entran esas dos cosas: lo que
   cuestan los sorteos y lo que se ha ganado. Los abonos entre Papá y Abuelo y
   Malle son cuenta aparte y no pintan nada en esto. */

/* En una fila que junta premio y abono, saca el abono de la nota para quedarse
   solo con el premio, que es lo único que la administradora descuenta. */
function abonoDeNota(nota){
  const n = (nota || '').toLowerCase().replace(/,/g, '.');
  const mm = n.match(/abon[ao]s?\s*(?:de\s*)?(\d+(?:\.\d+)?)/);
  return mm ? parseFloat(mm[1]) : null;
}

function nombreMes(clave){
  const [y, mes] = clave.split('-');
  const d = new Date(Number(y), Number(mes) - 1, 1);
  const txt = new Intl.DateTimeFormat('es-ES', { month:'long', year:'numeric' }).format(d);
  return txt.charAt(0).toUpperCase() + txt.slice(1);
}

function mesCorto(clave){
  const [y, mes] = clave.split('-');
  const d = new Date(Number(y), Number(mes) - 1, 1);
  return new Intl.DateTimeFormat('es-ES', { month:'long' }).format(d);
}

function mesesLoteria(){
  const precios = preciosAsociados();
  const meses = {};
  const tocar = k => (meses[k] = meses[k] || { clave:k, coste:0, premios:0, sorteos:0, aprox:false });

  for(const x of state.movements){
    if(!x.fecha) continue;
    const k = x.fecha.slice(0,7);
    if(x.tipo === 'jugada'){
      const t = tocar(k);
      t.coste += x.papa + x.abuelo;
      t.sorteos++;
      continue;
    }
    const r = categoriaAjuste(x, precios[x.id]);
    const total = -(x.papa + x.abuelo);
    if(r.cat === 'premio'){
      tocar(k).premios += total;
    } else if(r.cat === 'mixto'){
      const ab = abonoDeNota(x.nota);
      const t = tocar(k);
      if(ab === null){ t.premios += total; t.aprox = true; }   // no se puede separar
      else t.premios += round2(total - ab);
    }
  }
  const pag = new Set(state.loteria.pagados);
  return Object.values(meses)
    .map(t => ({ ...t, coste: round2(t.coste), premios: round2(t.premios),
                 neto: round2(t.coste - t.premios), pagado: pag.has(t.clave) }))
    .sort((a,b) => a.clave < b.clave ? 1 : -1);
}

    <h2>Apuntar</h2>
    ${renderTabs()}
    ${cuerpo}
    <div class="status ${ui.flash ? 'ok' : ''}" id="save-status">${escapeHtml(ui.flash)}</div>
  </div>`;
}

/* ---------- descarga ---------- */

function csvMovimientos(){
  const sep = ';';                       // el Excel español separa por punto y coma
  const esc = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
  const num = n => String(n).replace('.', ',');   // coma decimal
  const filas = state.movements.slice().sort((a,b) => {
    const fa = a.fecha || '', fb = b.fecha || '';
    if(fa !== fb) return fa < fb ? -1 : 1;
    return a.id - b.id;
  });
  let saldoP = 0, saldoA = 0;
  const lineas = [['Fecha','Tipo','Concepto','Papá','Abuelo y Malle','Saldo Papá','Saldo Abuelo y Malle'].join(sep)];
  for(const m of filas){
    saldoP = round2(saldoP + m.papa);
    saldoA = round2(saldoA + m.abuelo);
    const f = m.fecha ? m.fecha.split('-').reverse().join('/') : '';
    lineas.push([esc(f), esc(m.tipo === 'jugada' ? 'Sorteo' : 'Ajuste'), esc(m.nota),
                 num(m.papa), num(m.abuelo), num(saldoP), num(saldoA)].join(sep));
  }
  return '﻿' + lineas.join('\r\n');   // BOM para que Excel lea bien los acentos
}

function nombreArchivo(ext){
  return 'loteria-abuelo-' + hoy() + '.' + ext;
}

async function descargar(tipo){
  const el = document.getElementById('dl-status');
  const decir = (txt, cls) => { if(el){ el.className = 'dl-status ' + (cls||''); el.textContent = txt; } };
  let datos, intentos;
  if(tipo === 'csv'){
    datos = csvMovimientos();
    intentos = [nombreArchivo('csv'), nombreArchivo('txt')];   // csv puede no estar habilitado; txt siempre lo está
  } else if(tipo === 'html'){
    datos = page();
    intentos = [nombreArchivo('html'), nombreArchivo('txt')];
  } else {
    datos = JSON.stringify({ movements: state.movements, pendientes: state.pendientes, saltadas: state.saltadas, loteria: state.loteria }, null, 1);
    intentos = [nombreArchivo('json')];
  }

  let dl = null;
  try{
    if(typeof window.claude !== 'undefined' && typeof window.claude.use === 'function'){
      dl = await window.claude.use('downloads');
    }
  } catch(e){ dl = null; }
  if(!dl){ planB(tipo, datos, 'Aquí no se puede guardar archivos directamente.'); return; }

  decir('Preparando la descarga…');

  for(let i = 0; i < intentos.length; i++){
    try{
      await dl.save({ filename: intentos[i], data: datos });
      const cayoEnTxt = intentos[i].endsWith('.txt') && tipo !== 'txt';
      if(cayoEnTxt && tipo === 'html'){
        decir('Descargado como ' + intentos[i] + ' — renómbralo a .html para abrirlo en el navegador.', 'ok');
      } else if(cayoEnTxt){
        decir('Descargado como ' + intentos[i] + ' — renómbralo a .csv para abrirlo en Excel.', 'ok');
      } else {
        decir('Descargado: ' + intentos[i], 'ok');
      }
      return;
    } catch(err){
      const code = err && err.code;
      if(code === 'extension_not_enabled' && i < intentos.length - 1) continue;   // probar el siguiente formato
      if(code === 'declined'){ decir('Descarga cancelada.'); return; }
      if(code === 'rate_limited'){ decir('Espera un momento y vuelve a intentarlo.', 'err'); return; }
      console.error(err);
      planB(tipo, datos, 'La descarga no funcionó aquí (' + (code || 'error') + ').');
      return;
    }
  }
}

/* Plan B para cuando el móvil no deja guardar archivos: se enseña el contenido
   para copiarlo y pegarlo donde sea. Se inyecta en el DOM a mano, fuera del
   render, para que este texto no acabe dentro de la página publicada. */
const NOMBRES = { csv:'la hoja para Excel', json:'la copia de seguridad', html:'la página entera' };

function planB(tipo, datos, motivo){
  const el = document.getElementById('dl-status');
  if(el){ el.className = 'dl-status err'; el.textContent = motivo; }

  const viejo = document.getElementById('export-box');
  if(viejo) viejo.remove();

  const caja = document.createElement('div');
  caja.id = 'export-box';
  const grande = datos.length > 200000;
  caja.innerHTML =
    '<p>Copia ' + (NOMBRES[tipo] || 'el contenido') + ' y pégala donde quieras: un correo, Notas, Google Drive…'
    + (grande ? ' Ojo, son ' + Math.round(datos.length/1024) + ' KB: en el móvil va lento y quizá te resulte más cómodo desde el ordenador.' : '')
    + '</p>'
    + '<textarea readonly id="export-txt"></textarea>'
    + '<div class="exp-acts">'
    + '<button class="btn-sm" data-copiar="1">Copiar todo</button>'
    + '<button class="btn-sm ghost" data-cerrar-exp="1">Cerrar</button>'
    + '</div>';
  const panel = el ? el.parentNode : document.getElementById('app');
  panel.appendChild(caja);
  document.getElementById('export-txt').value = datos;
  caja.scrollIntoView({ behavior:'smooth', block:'center' });
}

/* El copiado va en su propio toque: tras un await el navegador ya no
   considera que haya gesto del usuario y bloquea el portapapeles. */
async function copiarExport(){
  const ta = document.getElementById('export-txt');
  const el = document.getElementById('dl-status');
  if(!ta) return;
  let ok = false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(ta.value);
      ok = true;
    }
  } catch(e){ ok = false; }
  if(!ok){
    try{
      ta.removeAttribute('readonly');
      ta.focus(); ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand('copy');
      ta.setAttribute('readonly','readonly');
    } catch(e){ ok = false; }
  }
  if(el){
    el.className = 'dl-status ' + (ok ? 'ok' : 'err');
    el.textContent = ok
      ? 'Copiado. Pégalo donde quieras.'
      : 'No se pudo copiar solo: mantén pulsado el texto, «Seleccionar todo» y copia.';
  }
  if(!ok){ ta.focus(); try{ ta.setSelectionRange(0, ta.value.length); }catch(e){} }
}

function renderApp(){ document.getElementById('app').innerHTML = renderBody(); }

/* ---------- dónde se guarda ----------
   Dos modos, y la página elige sola:
   · «pagina»: corre publicada en claude.ai y se guarda a sí misma. Se
     sincroniza: lo que apuntas en el móvil está luego en el ordenador.
   · «local»: corre en cualquier otro sitio (GitHub Pages, un servidor propio,
     el archivo en el móvil) y guarda en el almacenamiento del navegador. No
     necesita a nadie, pero los datos viven solo en ESE aparato.
   Si no se puede ninguna de las dos, se dice bien claro en vez de perder datos
   en silencio. */
const CLAVE_LOCAL = 'loteria-abuelo-v1';
let modoGuardado = 'desconocido';
let capPagina = null;

function datosActuales(){
  return { movements: state.movements, pendientes: state.pendientes,
           saltadas: state.saltadas, deshacer: state.deshacer, loteria: state.loteria };
}
function guardarLocal(){
  try{ localStorage.setItem(CLAVE_LOCAL, JSON.stringify(datosActuales())); return true; }
  catch(e){ return false; }
}
function leerLocal(){
  try{ const t = localStorage.getItem(CLAVE_LOCAL); return t ? JSON.parse(t) : null; }
  catch(e){ return null; }
}

async function persist(msg){
  ui.flash = msg || '';
  renderApp();
  const el = document.getElementById('save-status');
  const decir = (t, ok) => { if(el){ el.className = 'status ' + (ok ? 'ok' : ''); el.textContent = t; } };

  if(modoGuardado === 'local'){
    const ok = guardarLocal();
    decir((msg ? msg + ' · ' : '') + (ok ? 'guardado en este dispositivo' : 'NO se pudo guardar: el navegador no deja'), ok);
    return;
  }
  if(modoGuardado !== 'pagina'){
    decir((msg ? msg + ' · ' : '') + 'aquí no se guarda: se perderá al cerrar', false);
    return;
  }
  try{
    await capPagina.publish(page());
  } catch(err){
    const code = err && err.code;
    if(code === 'conflict') return;
    if(code === 'not_writer' || code === 'not_granted'){
      decir('Vista de solo lectura: aquí no se puede guardar.', false);
    } else {
      decir('No se pudo guardar (' + (code || 'error') + '). Inténtalo otra vez.', false);
    }
    console.error(err);
  }
}

/* ---------- eventos ---------- */

function leerImportesPremio(){
  const imp = {};
  for(const n of NUMEROS){
    const el = document.getElementById('premio-' + n.id);
    const v = el ? parseFloat(el.value) : NaN;
    imp[n.id] = isFinite(v) && v > 0 ? v : 0;
    if(el){
      const row = el.closest('.num-row');
      if(row) row.classList.toggle('on', imp[n.id] > 0);
    }
  }
  return imp;
}

function onInput(e){
  const t = e.target;
  if(t.dataset && t.dataset.preview === 'premio'){
    const el = document.getElementById('premio-preview');
    if(el) el.innerHTML = previewPremioHTML(leerImportesPremio());
  }
  if(t.dataset && t.dataset.preview === 'sorteo'){
    const el = document.getElementById('sorteo-preview');
    if(el) el.innerHTML = previewSorteoHTML(t.value);
  }
  if(t.dataset && t.dataset.pendPrecio){
    const el = document.querySelector('[data-split="' + t.dataset.pendPrecio + '"]');
    if(el) el.textContent = splitTexto(t.value);
  }
}

function onClick(e){
  if(e.target.closest('[data-copiar]')){ copiarExport(); return; }
  if(e.target.closest('[data-cerrar-exp]')){
    const c = document.getElementById('export-box'); if(c) c.remove();
    const st = document.getElementById('dl-status'); if(st){ st.className='dl-status'; st.textContent=''; }
    return;
  }

  const un = e.target.closest('[data-undo]');
  if(un && state.deshacer){
    const d = state.deshacer;
    state.movements = d.movements;
    state.pendientes = d.pendientes;
    state.saltadas = d.saltadas;
    if(d.loteria) state.loteria = d.loteria;
    state.deshacer = null;
    persist('Deshecho: ' + d.desc);
    return;
  }

  const dl = e.target.closest('[data-dl]');
  if(dl){ descargar(dl.dataset.dl); return; }

  const tab = e.target.closest('[data-tab]');
  if(tab){ ui.tab = tab.dataset.tab; ui.editId = null; ui.editTipo = null; ui.flash=''; renderApp(); return; }

  const qp = e.target.closest('[data-quickprice]');
  if(qp){
    const inp = document.getElementById('sorteo-precio');
    inp.value = qp.dataset.quickprice;
    document.getElementById('sorteo-preview').innerHTML = previewSorteoHTML(inp.value);
    return;
  }
  const qa = e.target.closest('[data-quickabono]');
  if(qa){ document.getElementById('abono-importe').value = qa.dataset.quickabono; return; }

  const reg = e.target.closest('[data-reg-pend]');
  if(reg){
    const fecha = reg.dataset.regPend;
    const inp = document.querySelector('[data-pend-precio="' + fecha + '"]');
    const precio = inp ? parseFloat(inp.value) : NaN;
    if(!isFinite(precio) || precio <= 0){ alert('Pon el precio de ese sorteo antes de registrarlo.'); return; }
    if(!confirmarDuplicado(fecha, null)) return;
    guardarDeshacer('apuntado el sorteo del ' + fmtFecha(fecha));
    state.movements.push({ id: nextId(), fecha, tipo:'jugada', nota:'Jugada semanal',
                           papa: round2(precio), abuelo: round2(precio*2) });
    state.pendientes = state.pendientes.filter(x => x.fecha !== fecha);
    ui.tab = 'premio'; ui.premioFecha = fecha;
    persist('Sorteo del ' + fmtFecha(fecha) + ' apuntado. ¿Tocó algo?');
    return;
  }
  const skip = e.target.closest('[data-skip-pend]');
  if(skip){
    const fecha = skip.dataset.skipPend;
    guardarDeshacer('saltado el sorteo del ' + fmtFecha(fecha));
    state.pendientes = state.pendientes.filter(x => x.fecha !== fecha);
    if(state.saltadas.indexOf(fecha) === -1) state.saltadas.push(fecha);
    persist('Sorteo del ' + fmtFecha(fecha) + ' quitado de la lista.');
    return;
  }
  const tg = e.target.closest('[data-toggle-pend]');
  if(tg){ ui.verTodasPend = !ui.verTodasPend; renderApp(); return; }

  const tm = e.target.closest('[data-toggle-meses]');
  if(tm){ ui.verTodosMeses = !ui.verTodosMeses; renderApp(); return; }

  const mes = e.target.closest('[data-mes]');
  if(mes){
    const k = mes.dataset.mes;
    const pagado = state.loteria.pagados.indexOf(k) !== -1;
    guardarDeshacer((pagado ? 'desmarcado' : 'marcado') + ' como pagado ' + nombreMes(k));
    state.loteria.pagados = pagado
      ? state.loteria.pagados.filter(x => x !== k)
      : state.loteria.pagados.concat([k]);
    persist(nombreMes(k) + (pagado ? ' vuelve a estar pendiente.' : ' marcado como pagado.'));
    return;
  }

  const hasta = e.target.closest('[data-mes-hasta]');
  if(hasta){
    const k = hasta.dataset.mesHasta;
    const nuevos = mesesLoteria().filter(m => m.clave <= k && !m.pagado).map(m => m.clave);
    if(!nuevos.length) return;
    guardarDeshacer('marcados como pagados ' + nuevos.length + ' meses hasta ' + nombreMes(k));
    state.loteria.pagados = state.loteria.pagados.concat(nuevos);
    persist(nuevos.length + ' mes' + (nuevos.length===1?'':'es') + ' marcado' + (nuevos.length===1?'':'s') + ' como pagado' + (nuevos.length===1?'':'s') + '.');
    return;
  }

  const yf = e.target.closest('[data-year-filter]');
  if(yf){ ui.year = yf.dataset.yearFilter; renderApp(); return; }
  const tf = e.target.closest('[data-tipo-filter]');
  if(tf){ ui.tipo = tf.dataset.tipoFilter; renderApp(); return; }

  const ed = e.target.closest('[data-edit]');
  if(ed){
    const m = state.movements.find(x => x.id === Number(ed.dataset.edit));
    if(m){
      ui.editId = m.id; ui.editTipo = m.tipo;
      ui.tab = m.tipo === 'jugada' ? 'sorteo' : 'otro';
      ui.flash = '';
      renderApp();
      const f = document.getElementById(m.tipo === 'jugada' ? 'form-sorteo' : 'form-otro');
      if(f) f.scrollIntoView({ behavior:'smooth', block:'center' });
    }
    return;
  }
  if(e.target.closest('[data-cancel-edit]')){ ui.editId=null; ui.editTipo=null; renderApp(); return; }

  const del = e.target.closest('[data-del]');
  if(del){
    const id = Number(del.dataset.del);
    if(confirm('¿Eliminar este movimiento?')){
      const m = state.movements.find(x => x.id === id);
      guardarDeshacer('eliminado «' + (m ? m.nota : '') + '» del ' + (m ? fmtFecha(m.fecha) : ''));
      state.movements = state.movements.filter(x => x.id !== id);
      if(ui.editId === id){ ui.editId=null; ui.editTipo=null; }
      persist('Movimiento eliminado.');
    }
    return;
  }
}

function onSubmit(e){
  const f = e.target;

  if(f.id === 'form-sorteo'){
    e.preventDefault();
    const fecha = f.fecha.value, precio = parseFloat(f.precio.value);
    const editId = f.editId.value ? Number(f.editId.value) : null;
    if(!fecha || !isFinite(precio) || precio <= 0){ alert('Pon una fecha y un precio válidos.'); return; }
    if(!confirmarDuplicado(fecha, editId)) return;
    guardarDeshacer((editId ? 'editado' : 'apuntado') + ' el sorteo del ' + fmtFecha(fecha));
    if(editId){
      const m = state.movements.find(x => x.id === editId);
      if(m){ m.fecha = fecha; m.papa = round2(precio); m.abuelo = round2(precio*2); }
    } else {
      state.movements.push({ id: nextId(), fecha, tipo:'jugada', nota:'Jugada semanal',
                             papa: round2(precio), abuelo: round2(precio*2) });
      state.pendientes = state.pendientes.filter(x => x.fecha !== fecha);
      ui.premioFecha = fecha;
    }
    ui.editId=null; ui.editTipo=null;
    persist(editId ? 'Sorteo actualizado.' : 'Sorteo apuntado.');
    return;
  }

  if(f.id === 'form-premio'){
    e.preventDefault();
    const fecha = f.fecha.value;
    const imp = leerImportesPremio();
    const t = repartoPremio(imp);
    if(!fecha){ alert('Pon la fecha del sorteo.'); return; }
    if(!t.papa && !t.abuelo){ alert('Pon el importe de al menos un número.'); return; }
    guardarDeshacer('apuntado el premio del ' + fmtFecha(fecha));
    state.movements.push({ id: nextId(), fecha, tipo:'ajuste', nota: notaPremio(imp),
                           papa: round2(-t.papa), abuelo: round2(-t.abuelo) });
    ui.premioFecha = null;
    persist('Premio apuntado: −' + fmtEUR(t.papa) + ' Papá, −' + fmtEUR(t.abuelo) + ' Abuelo y Malle.');
    return;
  }

  if(f.id === 'form-abono'){
    e.preventDefault();
    const fecha = f.fecha.value, importe = parseFloat(f.importe.value), quien = f.quien.value;
    if(!fecha || !isFinite(importe) || importe <= 0){ alert('Pon una fecha y un importe válidos.'); return; }
    const esPapa = quien === 'papa';
    guardarDeshacer('apuntado el abono de ' + fmtEUR(importe));
    state.movements.push({
      id: nextId(), fecha, tipo:'ajuste',
      nota: 'Abona ' + fmtEUR(importe) + (esPapa ? ' (Papá)' : ''),
      papa: esPapa ? round2(-importe) : 0,
      abuelo: esPapa ? 0 : round2(-importe)
    });
    persist('Abono de ' + fmtEUR(importe) + ' apuntado.');
    return;
  }

  if(f.id === 'form-otro'){
    e.preventDefault();
    const fecha = f.fecha.value;
    const concepto = f.concepto.value.trim() || 'Ajuste';
    const ip = round2(parseFloat(f.importePapa.value) || 0);
    const ia = round2(parseFloat(f.importeAbuelo.value) || 0);
    const editId = f.editId.value ? Number(f.editId.value) : null;
    if(!fecha){ alert('Pon una fecha.'); return; }
    guardarDeshacer((editId ? 'editado' : 'apuntado') + ' el ajuste «' + concepto + '»');
    if(editId){
      const m = state.movements.find(x => x.id === editId);
      if(m){ m.fecha=fecha; m.nota=concepto; m.papa=ip; m.abuelo=ia; }
    } else {
      state.movements.push({ id: nextId(), fecha, tipo:'ajuste', nota: concepto, papa: ip, abuelo: ia });
    }
    ui.editId=null; ui.editTipo=null;
    persist(editId ? 'Ajuste actualizado.' : 'Ajuste apuntado.');
    return;
  }
}

/* Decide dónde se guarda y lo dice NADA MÁS abrir, no cuando ya has apuntado
   media tarde. */
function mostrarModo(){
  const viejo = document.getElementById('modo-aviso');
  if(viejo) viejo.remove();
  if(modoGuardado === 'pagina') return;          // todo bien, no hace falta avisar

  const av = document.createElement('div');
  av.id = 'modo-aviso';
  if(modoGuardado === 'local'){
    av.className = 'local';
    av.innerHTML = '<span class="ca-txt"><strong>Guardado en este dispositivo.</strong> '
      + 'Lo que apuntes queda aquí, en este navegador, y funciona sin conexión. '
      + 'No se comparte con otros aparatos: haz una copia de seguridad de vez en cuando desde abajo.</span>';
  } else {
    av.className = 'malo';
    av.innerHTML = '<span class="ca-txt"><strong>Aquí no se guarda nada.</strong> '
      + 'Puedes mirarlo y hasta apuntar, pero al cerrar se pierde. '
      + 'Guarda este archivo en el móvil y ábrelo desde ahí, o usa la página de Lotería del Abuelo.</span>';
  }
  document.body.insertBefore(av, document.getElementById('app'));
}

async function arrancar(){
  renderApp();
  const app = document.getElementById('app');
  app.addEventListener('click', onClick);
  app.addEventListener('submit', onSubmit);
  app.addEventListener('input', onInput);

  // ¿corre publicada y puede guardarse a sí misma?
  try{
    if(typeof window.claude !== 'undefined' && typeof window.claude.use === 'function'){
      capPagina = await window.claude.use('artifact');
    }
  } catch(e){ capPagina = null; }

  if(capPagina){
    modoGuardado = 'pagina';
    mostrarModo();
    return;
  }

  // fuera de claude.ai: manda lo que haya guardado el navegador
  const guardado = leerLocal();
  if(guardado && Array.isArray(guardado.movements) && guardado.movements.length){
    state.movements = guardado.movements;
    state.pendientes = guardado.pendientes || [];
    state.saltadas = guardado.saltadas || [];
    state.deshacer = guardado.deshacer || null;
    state.loteria = guardado.loteria || { pagados: [] };
  }
  modoGuardado = guardarLocal() ? 'local' : 'ninguno';
  renderApp();
  mostrarModo();
}
arrancar();
</script>
